name: Phase 0 offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies (network required only for setup)
        run: python -m pip install -e ".[dev]"
      - name: Run offline CPU tests
        run: python -m pytest
      - name: Installed CLI smoke
        run: dishmook smoke --seed 42
