[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dishmook"
version = "0.0.1"
description = "Zero-paid-compute scientific multi-agent research lab — Phase 0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
dishmook = "dishmook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
