[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dishmook"
version = "0.0.1"
description = "Zero-paid-compute scientific multi-agent research lab — Phase 0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
qwen = ["transformers>=4.51,<5", "torch>=2.6,<3", "accelerate>=1.6,<2"]
research = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "transformers>=4.51,<5", "torch>=2.6,<3", "accelerate>=1.6,<2"]

[project.scripts]
dishmook = "dishmook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
