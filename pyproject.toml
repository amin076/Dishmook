[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dishmook"
version = "0.1.0"
description = "Zero-paid-compute scientific research lab — single-agent runtime"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
hf = ["transformers==4.57.1", "torch==2.8.0"]

[project.scripts]
dishmook = "dishmook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["hf: optional real local Hugging Face CPU adapter test"]
